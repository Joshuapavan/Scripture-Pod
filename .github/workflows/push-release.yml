name: Push Release

on:
  push:
    branches:
      - main
  create:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    if: ${{ github.event_name != 'create' || (github.event.ref_type == 'tag' && startsWith(github.event.ref, 'v')) }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Linux system libraries (WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm test

  build:
    if: ${{ github.event_name != 'create' || (github.event.ref_type == 'tag' && startsWith(github.event.ref, 'v')) }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target aarch64-apple-darwin --bundles dmg
            artifact: mac-arm64
          - os: macos-latest
            args: --target x86_64-apple-darwin --bundles dmg
            artifact: mac-x64
          - os: windows-latest
            args: --bundles nsis
            artifact: windows
          - os: ubuntu-22.04
            args: --bundles deb,appimage
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Linux system libraries (WebKitGTK)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # Signing and notarization run only when these secrets exist.
      # macOS: APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
      #        APPLE_ID, APPLE_PASSWORD (app-specific), APPLE_TEAM_ID
      - name: Build installer
        run: npx --yes @tauri-apps/cli@2 build ${{ matrix.args }}
        working-directory: src-tauri
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: packaged-${{ matrix.artifact }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 7

  release:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' || (github.event_name == 'create' && github.event.ref_type == 'tag' && startsWith(github.event.ref, 'v')) }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: packaged-*
          path: release-assets
          merge-multiple: true
      - name: Create versioned tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            version=$(node -p "require('./package.json').version")
            tag="v${version}-build.${GITHUB_RUN_NUMBER}"
          fi
          release_flags=()
          if [[ "$tag" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          mapfile -d '' release_assets < <(
            find release-assets -type f \( -iname '*.dmg' -o -iname '*.exe' -o -iname '*.appimage' -o -iname '*.deb' \) -print0 | sort -z
          )
          if (( ${#release_assets[@]} == 0 )); then
            echo 'No distributable release assets were found.' >&2
            exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            existing_asset_count=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')
            if [[ "$existing_asset_count" != '0' ]]; then
              echo "Release $tag already has assets; refusing to overwrite them." >&2
              exit 1
            fi
            gh release upload "$tag" "${release_assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "${release_assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Scripture Pod $tag" \
              --notes "Automated release from commit $GITHUB_SHA." \
              "${release_flags[@]}"
          fi
