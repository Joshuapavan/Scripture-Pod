name: Push Release

on:
  push:
    branches:
      - main
  create:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Also publish a GitHub release with the installers
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # Fast checks: the Node tests and the Rust core crate (no windowing, so no system libraries
  # and no Tauri compile). Runs alongside the installer builds instead of in front of them.
  test:
    if: ${{ github.event_name != 'create' || (github.event.ref_type == 'tag' && startsWith(github.event.ref, 'v')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo test -p sp-core
        working-directory: src-tauri

  build:
    if: ${{ github.event_name != 'pull_request' && (github.event_name != 'create' || (github.event.ref_type == 'tag' && startsWith(github.event.ref, 'v'))) }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target aarch64-apple-darwin --bundles dmg
            artifact: mac-arm64
          - os: macos-latest
            args: --target x86_64-apple-darwin --bundles dmg
            artifact: mac-x64
          - os: windows-latest
            args: --bundles nsis
            artifact: windows
          - os: ubuntu-22.04
            args: --bundles deb,appimage
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Linux system libraries (WebKitGTK)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # Unsigned on purpose (no Apple Developer ID): macOS shows an "unidentified developer"
      # warning on first open (right-click the app, then Open).
      - name: Build installer
        run: npx --yes @tauri-apps/cli@2 build ${{ matrix.args }}
        working-directory: src-tauri
        shell: bash
      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: packaged-${{ matrix.artifact }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14

  release:
    # Builds from main only upload downloadable files to the run. A release is published for a
    # v* tag, or when you run the workflow by hand with "publish" ticked.
    if: ${{ (github.event_name == 'create' && github.event.ref_type == 'tag' && startsWith(github.event.ref, 'v')) || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    needs: [test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: packaged-*
          path: release-assets
          merge-multiple: true
      - name: Create versioned tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            version=$(node -p "require('./package.json').version")
            tag="v${version}-build.${GITHUB_RUN_NUMBER}"
          fi
          release_flags=()
          if [[ "$tag" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          mapfile -d '' release_assets < <(
            find release-assets -type f \( -iname '*.dmg' -o -iname '*.exe' -o -iname '*.appimage' -o -iname '*.deb' \) -print0 | sort -z
          )
          if (( ${#release_assets[@]} == 0 )); then
            echo 'No distributable release assets were found.' >&2
            exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            existing_asset_count=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')
            if [[ "$existing_asset_count" != '0' ]]; then
              echo "Release $tag already has assets; refusing to overwrite them." >&2
              exit 1
            fi
            gh release upload "$tag" "${release_assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "${release_assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Scripture Pod $tag" \
              --notes "Automated release from commit $GITHUB_SHA." \
              "${release_flags[@]}"
          fi
